# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openig831t"
version = "0.1.0a0"
description = "Experimental IG831T USB, AT, QMI and Linux gadget interoperability research"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt"]
authors = [{name = "OpenIG831T contributors"}]
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Operating System :: MacOS"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "jsonschema>=4,<5", "PyYAML>=6,<7", "detect-secrets==1.5.0", "build>=1,<2", "setuptools>=77", "wheel>=0.45"]

[project.scripts]
igbridge = "igbridge.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
igbridge = ["data/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# First incremental lint expansion: all Pyflakes correctness checks.
# Formatting/import-order and broader B/UP migrations are deliberately separate.
select = ["E9", "F"]
