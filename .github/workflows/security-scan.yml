# SPDX-License-Identifier: Apache-2.0
name: Security scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  publication-audit:
    name: Publication audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install reviewed pip security fix before resolving dependencies
        run: python -m pip install --upgrade 'pip==26.2'
      - run: python -m pip install -e '.[dev]'
      - run: make audit
      - name: Audit resolved development dependencies against PyPI advisories
        # Capture tested versions before installing the auditor in an isolated environment.
        # This networked audit does not auto-fix packages or suppress vulnerabilities.
        run: |
          python -m pip freeze --all --exclude-editable > "$RUNNER_TEMP/dev-audit-requirements.txt"
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install 'pip-audit==2.10.1'
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip_audit --strict --no-deps --disable-pip --progress-spinner off --timeout 30 -r "$RUNNER_TEMP/dev-audit-requirements.txt"
